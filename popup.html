<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duplicate Tab Cleaner</title>
    <style>
        body {
            width: 200px;
            padding: 15px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background-color: #f9f9f9;
            color: #333;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #004d99;
        }

        #status {
            margin-top: 10px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <button id="cleanTabs">Clean Duplicate Tabs</button>
    <div id="status">Ready</div>
    <script src="popup.js"></script>
</body>
</html>
